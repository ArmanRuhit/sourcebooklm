[project]
name = "sourcebooklm-api"
version = "0.1.0"
description = "SourcebookLM API — grounded, cited answers over your notebook sources"
requires-python = ">=3.13"
dependencies = [
    # web layer
    "fastapi==0.142.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sse-starlette==3.5.0",
    # database
    "sqlalchemy[asyncio]==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    # ai / rag
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langgraph==1.2.14",
    "langchain-openai==1.7.0",
    "langchain-deepseek==1.1.1",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
    "langchain-postgres==0.0.19",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "mypy==2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
files = ["app"]