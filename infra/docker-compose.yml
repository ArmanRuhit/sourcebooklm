# SourcebookLM - local dev database (Postgres 17 + pgvector)
# Usage (from repo root): docker compose -f infra/docker-compose.yml up -d
name: sourcebooklm

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sourcebooklm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sourcebooklm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: